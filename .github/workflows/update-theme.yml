name: Update Tang theme

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tang-theme-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tang-theme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.THEME_SYNC_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      THEME_BRANCH: codex/update-tang-theme
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.THEME_SYNC_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/remotes/origin/$THEME_BRANCH"; then
            git switch --create "$THEME_BRANCH" --track "origin/$THEME_BRANCH"
            git merge --no-edit "origin/$BASE_BRANCH"
          else
            git switch --create "$THEME_BRANCH"
          fi

      - name: Synchronize theme
        id: sync
        run: |
          npm run theme:update
          if [ -n "$(git status --porcelain)" ] || ! git diff --quiet "origin/$BASE_BRANCH"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate the candidate before opening a PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          pnpm test
          pnpm lint
          pnpm format:check
          npm run build:release

      - name: Commit and open or update the PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Tang theme'
          fi
          git push origin "HEAD:$THEME_BRANCH"
          revision=$(node -p 'JSON.parse(require("fs").readFileSync("theme.lock.json", "utf8")).revision')
          printf 'Update the Tang theme to [%s](https://github.com/tangwz/tang/commit/%s), preserving personal content, site settings and local adaptations.\n\nValidation: tests, lint, formatting and the production release build passed in [this workflow run](%s/%s/actions/runs/%s).\n' \
            "$revision" "$revision" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tang-update.md"
          number=$(gh pr list --head "$THEME_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title 'chore: update Tang theme' --body-file "$RUNNER_TEMP/tang-update.md"
          else
            gh pr create --head "$THEME_BRANCH" --base "$BASE_BRANCH" --title 'chore: update Tang theme' --body-file "$RUNNER_TEMP/tang-update.md"
          fi
